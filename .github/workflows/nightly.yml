name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-long:
    name: fuzz (1h per target)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with: { go-version: "1.23" }
      - run: make fuzz-long
      # A crasher found here is committed to testdata/fuzz/ and becomes a
      # permanent regression test, not a one-off fix.
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
