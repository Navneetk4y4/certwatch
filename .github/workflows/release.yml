# Release: signed, reproducible, with an SBOM.
#
# The collector is open source and runs inside customer networks. "Build it
# yourself from this tag and get identical bytes" is the strongest possible
# answer to "how do I know this binary does what the source says?" — so the
# reproducibility check is a RELEASE GATE, not a nicety.
#
# NOTE ON ACTION PINS: the SHAs below were written offline and must be verified
# against upstream before this workflow is first run. See the note in ci.yml.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release
  id-token: write   # cosign keyless (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with: { go-version: "1.23" }

      # Every mandatory gate must pass before anything is published.
      - name: all gates
        run: make check

      - name: reproducible build gate
        run: make repro

      - name: build all targets
        run: make build-all
        env:
          SOURCE_DATE_EPOCH: "1757894400"

      - name: SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.17.8
        with:
          path: .
          format: cyclonedx-json
          output-file: build/sbom.cdx.json

      # An unexpected dependency appearing between releases fails the build.
      # certscan currently has ZERO runtime dependencies; if that changes, it
      # changes deliberately, in a diff someone reviewed.
      - name: SBOM diff against the previous release
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ] && [ -f .sbom-baseline.json ]; then
            if ! diff -q <(jq -S '.components[].name' .sbom-baseline.json) \
                         <(jq -S '.components[].name' build/sbom.cdx.json); then
              echo "::error::the dependency set changed since $prev; review it deliberately"
              exit 1
            fi
          fi

      - name: cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: sign every artefact
        run: |
          cd build
          for f in certscan-*; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done
          shasum -a 256 certscan-* > SHA256SUMS
          cosign sign-blob --yes --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem SHA256SUMS

      - name: publish
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            build/certscan-*
            build/SHA256SUMS*
            build/sbom.cdx.json
          body: |
            Verify this release:

                cosign verify-blob \
                  --certificate certscan-linux-amd64.pem \
                  --signature certscan-linux-amd64.sig \
                  --certificate-identity-regexp 'https://github.com/certwatch/certwatch/.*' \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                  certscan-linux-amd64

            Or build it yourself and compare — the build is reproducible:

                git checkout ${{ github.ref_name }} && make build-all
                shasum -a 256 -c SHA256SUMS
