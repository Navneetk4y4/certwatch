server {
    listen 8443 ssl;
    server_name wronghost.lab.internal.test;
    ssl_certificate     /certs/wronghost.crt;
    ssl_certificate_key /certs/wronghost.key;
    ssl_session_tickets off;
    ssl_session_cache   off;
    location / { return 200 "wronghost\n"; add_header Content-Type text/plain; }
}
