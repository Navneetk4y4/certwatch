server {
    listen 8443 ssl;
    server_name expired.lab.internal.test;
    ssl_certificate     /certs/expired.crt;
    ssl_certificate_key /certs/expired.key;
    ssl_session_tickets off;
    ssl_session_cache   off;
    location / { return 200 "expired\n"; add_header Content-Type text/plain; }
}
