# web-divergent (item 064 / GAP-3): same hostname, same approved issuer, a
# DIFFERENT valid certificate. Policy mode accepts both, so cross-IP
# fingerprint divergence is the only signal the pool is split.
server {
    listen 8443 ssl;
    server_name lab.internal.test;
    ssl_certificate     /certs/divergent.crt;
    ssl_certificate_key /certs/divergent.key;
    ssl_session_tickets off;
    ssl_session_cache   off;
    location / { return 200 "divergent\n"; add_header Content-Type text/plain; }
}
