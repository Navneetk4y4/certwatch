# web-noreload (item 061): the classic failure. The certificate file on disk
# was replaced, but the process was never reloaded, so it still serves the OLD
# one. Mounted to rotate-new.crt; nginx is started before the swap.
server {
    listen 8443 ssl;
    server_name rotate.lab.internal.test;
    ssl_certificate     /certs/rotate-old.crt;
    ssl_certificate_key /certs/rotate-old.key;
    ssl_session_tickets off; ssl_session_cache off;
    location / { return 200 "noreload\n"; }
}
