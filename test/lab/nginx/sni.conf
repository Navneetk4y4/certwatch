# web-sni (item 062): THREE hostnames on ONE address. A scanner that does not
# send SNI gets the default server and reports the wrong certificate.
server {
    listen 8443 ssl default_server;
    server_name alpha.lab.internal.test;
    ssl_certificate /certs/sni-alpha.crt; ssl_certificate_key /certs/sni-alpha.key;
    ssl_session_tickets off; ssl_session_cache off;
    location / { return 200 "alpha\n"; }
}
server {
    listen 8443 ssl;
    server_name beta.lab.internal.test;
    ssl_certificate /certs/sni-beta.crt; ssl_certificate_key /certs/sni-beta.key;
    ssl_session_tickets off; ssl_session_cache off;
    location / { return 200 "beta\n"; }
}
server {
    listen 8443 ssl;
    server_name gamma.lab.internal.test;
    ssl_certificate /certs/sni-gamma.crt; ssl_certificate_key /certs/sni-gamma.key;
    ssl_session_tickets off; ssl_session_cache off;
    location / { return 200 "gamma\n"; }
}
