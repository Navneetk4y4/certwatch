# web-mtls (item 062): rejects us at the handshake, but has ALREADY sent its
# certificate. The scanner must record what it saw and say the handshake was
# incomplete, not report the endpoint as unreachable.
server {
    listen 8443 ssl;
    server_name mtls.lab.internal.test;
    ssl_certificate     /certs/pool.crt;
    ssl_certificate_key /certs/pool.key;
    ssl_client_certificate /certs/ca-bundle.crt;
    ssl_verify_client on;
    ssl_session_tickets off; ssl_session_cache off;
    location / { return 200 "mtls\n"; }
}
