server {
    listen 8443 ssl;
    server_name nearexpiry.lab.internal.test;
    ssl_certificate     /certs/nearexpiry.crt;
    ssl_certificate_key /certs/nearexpiry.key;
    ssl_session_tickets off;
    ssl_session_cache   off;
    location / { return 200 "nearexpiry\n"; add_header Content-Type text/plain; }
}
