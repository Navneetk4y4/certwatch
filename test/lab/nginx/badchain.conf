server {
    listen 8443 ssl;
    server_name badchain.lab.internal.test;
    ssl_certificate     /certs/badchain.crt;
    ssl_certificate_key /certs/badchain.key;
    ssl_session_tickets off;
    ssl_session_cache   off;
    location / { return 200 "badchain\n"; add_header Content-Type text/plain; }
}
