# web-a / web-b / web-c: the healthy pool. All three serve the SAME certificate.
server {
    listen 8443 ssl;
    http2 on;
    server_name lab.internal.test;
    ssl_certificate     /certs/pool.crt;
    ssl_certificate_key /certs/pool.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Session resumption off: a cached certificate must never mask a change.
    ssl_session_tickets off;
    ssl_session_cache   off;
    location / { return 200 "$hostname\n"; add_header Content-Type text/plain; }
}
