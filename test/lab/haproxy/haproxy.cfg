# Item 059. A TLS-terminating load balancer in front of the pool.
#
# This is the shape the product exists for: one hostname, one VIP, several
# backends. A monitor that checks the VIP sees ONE certificate. Only checking
# each backend address separately reveals that they disagree.
global
    log stdout format raw local0
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode    http
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    log     global

frontend fe_lab
    bind :8443 ssl crt /certs/haproxy-pool.pem
    default_backend be_pool

backend be_pool
    balance roundrobin
    server web-a 10.77.0.11:8443 ssl verify none
    server web-b 10.77.0.12:8443 ssl verify none
    server web-c 10.77.0.13:8443 ssl verify none

listen stats
    bind :8404
    stats enable
    stats uri /
